<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Soundboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="glass-panel">
        <h1>👾 Arcade Board</h1>

        <div class="sound-grid">
            <button class="sound-btn color-1" data-sound="https://actions.google.com/sounds/v1/cartoon/slide_whistle.ogg">
                🎢 Whistle
            </button>
            
            <button class="sound-btn color-2" data-sound="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg">
                🤪 Boing
            </button>
            
            <button class="sound-btn color-3" data-sound="https://actions.google.com/sounds/v1/cartoon/pop.ogg">
                🫧 Pop
            </button>
            
            <button class="sound-btn color-4" data-sound="https://actions.google.com/sounds/v1/transportation/car_horn.ogg">
                📢 Honk
            </button>
        </div>

        <div class="controls">
            <div class="volume-box">
                <label>Vol:</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
            </div>
            
            <button id="stop-btn">🛑 STOP ALL</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
